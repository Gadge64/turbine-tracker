{% extends "base.html" %}
{% block content %}
<h2>Add New User</h2>
<div class="card">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid two">
      <div><label>Username</label><input name="username" required></div>
      <div><label>Password</label><input type="password" name="password" required></div>
      <div class="span-2"><label>Full name</label><input name="full_name"></div>
      <div class="span-2"><label><input type="checkbox" name="is_admin"> Grant admin access</label></div>
    </div>
    <div class="actions-row">
      <button type="submit">Create user</button>
      <a class="button-link btn-secondary" href="{{ url_for('admin_users') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
