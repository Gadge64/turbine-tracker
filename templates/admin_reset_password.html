{% extends "base.html" %}
{% block content %}
<h2>Reset Password</h2>
<div class="card">
<p>Reset password for: <strong>{{ target_user.username }}</strong></p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>New password</label><input type="password" name="new_password" required><div class="actions-row"><button>Reset password</button><a class="button-link btn-secondary" href="{{ url_for('admin_users') }}">Cancel</a></div></form>
</div>
{% endblock %}
