{% extends "base.html" %}
{% block content %}
<h2>Add Monthly Entry</h2>
<div class="card">
<form method="post" class="stack">
  <div class="form-grid two">
    <div><label>Year</label><input type="number" name="year" value="{{ default_year }}" required></div>
    <div><label>Month</label><input type="number" name="month" value="{{ default_month }}" min="1" max="12" required></div>
    <div><label>Import on 1st day (kWh)</label><input type="number" step="any" name="import_start_kwh" value="{{ default_import_start if default_import_start is not none else '' }}"><div class="muted">Auto-filled from last month if available.</div></div>
    <div><label>Import on last day (kWh)</label><input type="number" step="any" name="import_end_kwh"></div>
    <div><label>Export on 1st day (kWh)</label><input type="number" step="any" name="export_start_kwh" value="{{ default_export_start if default_export_start is not none else '' }}"></div>
    <div><label>Export on last day (kWh)</label><input type="number" step="any" name="export_end_kwh"></div>
    <div><label>E-mon (kWh)</label><input type="number" step="any" name="e_mon_kwh"></div>
    <div><label>Used from wind override (kWh)</label><input type="number" step="any" name="used_from_wind_kwh"></div>
    <div><label>Inverter Total cumulative (kWh)</label><input type="number" step="any" name="inverter_total_kwh" value="{{ default_inverter_total if default_inverter_total is not none else '' }}"><div class="muted">Leave blank to auto-calculate on save.</div></div>
    <div><label>Tariff rate</label><input type="number" step="any" name="tariff_rate" value="{{ default_tariff }}"></div>
    <div><label>CO₂ (kg)</label><input type="number" step="any" name="co2_kg"></div>
    <div class="span-2"><label>Notes</label><textarea name="notes" rows="3"></textarea></div>
  </div>
  <div class="actions-row"><button type="submit">Save</button><a class="button-link btn-secondary" href="{{ url_for('dashboard') }}">Cancel</a></div>
</form>
</div>
{% endblock %}
